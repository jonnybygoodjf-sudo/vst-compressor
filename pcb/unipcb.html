<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>UniPCB</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--line:#2b3440;--txt:#d7dde5;--dim:#8b95a3;--acc:#4aa3ff;--ok:#3fb950}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.35 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#top .brand{font-weight:700;letter-spacing:.5px;margin-right:8px;color:#fff}
#top .brand b{color:var(--acc)}
button,select,input{font:inherit}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.pri{background:#1f6feb;border-color:#1f6feb;color:#fff}
button.pri:hover{background:#388bfd}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#main{flex:1;display:flex;min-height:0}
#tools{width:74px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow:auto}
#tools button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:11px}
#tools button .ic{font-size:18px;line-height:1}
#tools button .kb{color:var(--dim);font-size:10px}
#tools button.on{background:#12324f;border-color:var(--acc)}
#stage{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#hud{position:absolute;left:26px;top:26px;background:rgba(13,17,23,.8);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--dim);pointer-events:none;max-width:70%}
#side{width:270px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:8px}
#side h3{margin:10px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
#side h3:first-child{margin-top:0}
.lay{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:5px;cursor:pointer}
.lay.on{background:#12324f}
.lay .sw{width:12px;height:12px;border-radius:3px}
.lay .nm{flex:1}
.lay .kb{color:var(--dim);font-size:11px}
.row{display:flex;align-items:center;gap:6px;margin:4px 0}
.row label{flex:1;color:var(--dim)}
.row input,.row select{width:96px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.row input[type=checkbox]{width:auto}
#lib{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:5px;margin-top:6px}
#lib .cat{position:sticky;top:0;background:var(--panel2);padding:3px 8px;font-size:11px;color:var(--dim)}
#lib .it{padding:4px 8px;cursor:pointer;border-top:1px solid #1d242d}
#lib .it:hover{background:#1b2a3a}
#lib .it.on{background:#12324f}
#libq{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px 6px}
#status{display:flex;gap:16px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--dim);font-size:12px}
#status .grow{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:340px;max-width:92vw;max-height:92vh;display:flex;flex-direction:column}
.modal h2{margin:0;padding:12px 16px;font-size:15px;border-bottom:1px solid var(--line)}
.modal .body{padding:14px 16px;overflow:auto}
.modal .foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.modal kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
.modal table{border-collapse:collapse}
.modal td{padding:2px 12px 2px 0;vertical-align:top}
#prevbox{background:#fff;border:1px solid #888;margin-top:8px;max-height:46vh;overflow:auto;padding:6px}
#prevbox svg{width:100%;height:auto;display:block}
#printSheet{display:none}
@media print{
  @page{margin:0}
  body.printing{overflow:visible;background:#fff}
  body.printing #app,body.printing .modalbg{display:none!important}
  body.printing #printSheet{display:block;position:absolute;left:10mm;top:10mm;background:#fff}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="brand">Uni<b>PCB</b></span>
    <button id="bNew" title="Nova placa">Novo</button>
    <button id="bOpen" title="Abrir projeto (Ctrl+O)">Abrir</button>
    <button id="bRimu" title="Abrir um projeto do Rimu PCB (.pcb)">Importar Rimu…</button>
    <button id="bSave" title="Salvar projeto (Ctrl+S)">Salvar</button>
    <span class="sep"></span>
    <button id="bUndo" title="Desfazer (Ctrl+Z)">↶ Desfazer</button>
    <button id="bRedo" title="Refazer (Ctrl+Y)">↷ Refazer</button>
    <span class="sep"></span>
    <button id="bBoard" title="Criar contorno retangular da placa">Placa…</button>
    <button id="bFit" title="Enquadrar tudo (Home)">Enquadrar</button>
    <span class="sep"></span>
    <button id="bMirH" title="Espelhar a seleção na lateral — esquerda⇄direita (M)">⇋ Espelhar</button>
    <button id="bMirV" title="Espelhar a seleção na vertical — cima⇄baixo (Shift+M)">⇵ Espelhar</button>
    <button id="bFollow" title="Quando ligado, as trilhas ligadas aos pads acompanham o componente ao mover, girar ou espelhar">Trilhas seguem: Sim</button>
    <span class="sep"></span>
    <button id="bPrint" title="Imprimir em escala 1:1">Imprimir 1:1…</button>
    <button id="bFab" class="pri" title="Gerber + Excellon (.zip)">Exportar Gerber (.zip)</button>
    <span class="sep"></span>
    <button id="bHelp">Atalhos</button>
    <input type="file" id="fOpen" accept=".json,.unipcb" hidden>
    <input type="file" id="fRimu" accept=".pcb" hidden>
    <input type="file" id="fLib" accept=".kicad_mod" multiple hidden>
  </header>
  <div id="main">
    <nav id="tools"></nav>
    <div id="stage"><canvas id="cv"></canvas><div id="hud"></div></div>
    <aside id="side">
      <h3>Camadas</h3><div id="layers"></div>
      <div class="row"><label for="dim">Realçar camada ativa</label><input type="checkbox" id="dim" checked></div>
      <h3>Ajustes</h3>
      <div class="row"><label>Grade (mm)</label><select id="grid"></select></div>
      <div class="row"><label>Largura da trilha (mm)</label><input type="number" id="sTw" step="0.05" min="0.05" value="0.8"></div>
      <div class="row"><label>Pad ⌀ / furo (mm)</label><span><input type="number" id="sPd" step="0.1" min="0.2" value="1.8" style="width:50px"> <input type="number" id="sPh" step="0.1" min="0" value="0.8" style="width:50px"></span></div>
      <div class="row"><label>Formato do pad</label><select id="sPs"><option value="round">Redondo</option><option value="rect">Quadrado</option><option value="oval">Oval</option></select></div>
      <div class="row"><label>Via ⌀ / furo (mm)</label><span><input type="number" id="sVd" step="0.1" min="0.4" value="1.2" style="width:50px"> <input type="number" id="sVh" step="0.1" min="0.2" value="0.6" style="width:50px"></span></div>
      <div class="row"><label>Texto (mm)</label><input type="number" id="sTs" step="0.25" min="0.5" value="1.5"></div>
      <div class="row"><label>Ângulos de 45°/90°</label><input type="checkbox" id="sAng" checked></div>
      <h3>Propriedades</h3><div id="props"><span style="color:var(--dim)">Nada selecionado</span></div>
      <h3>Biblioteca</h3>
      <input id="libq" placeholder="Buscar componente…">
      <div id="lib"></div>
      <div class="row" style="margin-top:6px"><button id="bImpLib" style="flex:1">Importar footprint (.kicad_mod)…</button></div>
      <div class="row" style="margin-top:6px"><button id="bImpRlb" style="flex:1">Importar biblioteca Rimu (.rlb)…</button></div>
      <input type="file" id="fRlb" accept=".rlb,.sbc" multiple hidden>
    </aside>
  </div>
  <footer id="status"><span id="stXY">X 0.00 Y 0.00 mm</span><span id="stZ"></span><span class="grow" id="stHint"></span></footer>
</div>
<div id="printSheet"></div>

<script>
/* ===== Importador de projetos do Rimu PCB (.pcb) — formato OLE + serialização MFC ===== */
const RimuImport = (() => {
  /* ---- leitor mínimo de OLE/CFB: devolve o stream "Contents" ---- */
  function cfbStream(u8, wanted) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const sig = [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1];
    for (let i = 0; i < 8; i++) if (u8[i] !== sig[i]) throw new Error('não é um arquivo do Rimu (.pcb)');
    const ss = 1 << dv.getUint16(30, true), mss = 1 << dv.getUint16(32, true);
    const nFat = dv.getUint32(44, true), dirStart = dv.getUint32(48, true), cutoff = dv.getUint32(56, true);
    const miniStart = dv.getUint32(60, true), nMini = dv.getUint32(64, true);
    let difStart = dv.getUint32(68, true); const nDif = dv.getUint32(72, true);
    const secOff = s => (s + 1) * ss;
    const difat = [];
    for (let i = 0; i < 109; i++) { const v = dv.getUint32(76 + 4 * i, true); if (v < 0xFFFFFFFA) difat.push(v); }
    for (let k = 0; k < nDif && difStart < 0xFFFFFFFA; k++) {
      const o = secOff(difStart);
      for (let i = 0; i < ss / 4 - 1; i++) { const v = dv.getUint32(o + 4 * i, true); if (v < 0xFFFFFFFA) difat.push(v); }
      difStart = dv.getUint32(o + ss - 4, true);
    }
    const fat = [];
    for (const s of difat.slice(0, nFat)) { const o = secOff(s); for (let i = 0; i < ss / 4; i++) fat.push(dv.getUint32(o + 4 * i, true)); }
    const chain = (start, tbl) => { const out = []; let s = start, guard = 0; while (s < 0xFFFFFFFA && guard++ < 1e6) { out.push(s); s = tbl[s]; } return out; };
    const readChain = (start, size) => {
      const secs = chain(start, fat), buf = new Uint8Array(secs.length * ss);
      secs.forEach((s, i) => buf.set(u8.subarray(secOff(s), secOff(s) + ss), i * ss));
      return size == null ? buf : buf.subarray(0, size);
    };
    const dir = readChain(dirStart), ddv = new DataView(dir.buffer, dir.byteOffset, dir.byteLength);
    const ents = [];
    for (let o = 0; o + 128 <= dir.length; o += 128) {
      const nl = ddv.getUint16(o + 64, true); if (!nl) continue;
      let name = ''; for (let i = 0; i < (nl - 2) / 2; i++) name += String.fromCharCode(ddv.getUint16(o + 2 * i, true));
      ents.push({ name, type: dir[o + 66], start: ddv.getUint32(o + 116, true), size: ddv.getUint32(o + 120, true) });
    }
    const e = ents.find(x => x.name === wanted && x.type === 2); if (!e) throw new Error('arquivo do Rimu sem o bloco "' + wanted + '"');
    if (e.size >= cutoff) return readChain(e.start, e.size);
    const root = ents.find(x => x.type === 5), rootData = readChain(root.start, root.size);
    const mfatRaw = readChain(miniStart), mdv = new DataView(mfatRaw.buffer, mfatRaw.byteOffset, mfatRaw.byteLength), mfat = [];
    for (let i = 0; i < mfatRaw.length / 4; i++) mfat.push(mdv.getUint32(4 * i, true));
    const secs = chain(e.start, mfat), out = new Uint8Array(e.size);
    secs.forEach((s, i) => { const part = rootData.subarray(s * mss, s * mss + mss), at = i * mss; out.set(part.subarray(0, Math.max(0, Math.min(mss, e.size - at))), at); });
    return out;
  }

  /* ---- leitura dos objetos ---- */
  function parse(u8, lib) {
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), N = u8.length;
    const I = o => dv.getInt32(o, true), W = o => dv.getUint16(o, true), D = o => dv.getFloat64(o, true);
    const matOk = o => {
      const m = []; for (let i = 0; i < 6; i++) { const v = D(o + 8 * i); if (!isFinite(v) || Math.abs(v) > 1e7) return null; m.push(v); }
      const [a, b, , c, d] = m; if (Math.abs(Math.abs(a * d - b * c) - 1) > 1e-6 || Math.abs(a) > 1.0000001 || Math.abs(b) > 1.0000001) return null; return m;
    };
    const cstr = p => { const n = u8[p]; let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(u8[p + 1 + i]); return [s, p + 1 + n]; };
    const printable = (p, n) => { let k = 0; while (k < n && u8[p + k]) k++; if (k < 3) return null; for (let i = 0; i < k; i++) if (u8[p + i] < 32 || u8[p + i] > 126) return null; return String.fromCharCode(...u8.subarray(p, p + k)); };
    /* 1) tracks, pads, arcs por assinatura */
    const recs = []; let last = -1;
    for (let o = 0; o < N - 120; o++) {
      if (o < last) continue;
      const A = I(o), B = I(o + 4); if (A < 0 || A > 6 || B < 0 || B > 40) continue;
      const n = I(o + 24);
      if (n >= 2 && n <= 800 && o + 32 + 8 * n <= N) {
        const w = I(o + 28 + 8 * n);
        if (w >= 10 && w <= 30000) {
          const pts = []; let x0 = 1e12, y0 = 1e12, x1 = -1e12, y1 = -1e12;
          for (let i = 0; i < n; i++) { const x = I(o + 28 + 8 * i), y = I(o + 32 + 8 * i); pts.push([x, y]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
          const r = [I(o + 8), I(o + 12), I(o + 16), I(o + 20)], e = w / 2 + 1;
          if ((Math.abs(x0 - r[0] - w / 2) <= e && Math.abs(y0 - r[1] - w / 2) <= e && Math.abs(r[2] - x1 - w / 2) <= e && Math.abs(r[3] - y1 - w / 2) <= e) || (x0 === r[0] && y0 === r[1] && x1 === r[2] && y1 === r[3])) {
            recs.push({ o, k: 'T', A, B, pts, w }); last = o + 32 + 8 * n; continue;
          }
        }
      }
      const r = [I(o + 8), I(o + 12), I(o + 16), I(o + 20)], wd = r[2] - r[0], ht = r[3] - r[1];
      if (wd < 100 || wd > 60000 || ht < 100 || ht > 60000) continue;
      const m = matOk(o + 24); if (!m) continue;
      const shape = I(o + 72), h1 = I(o + 78), h2 = I(o + 82);
      if (shape >= 0 && shape <= 5 && h1 >= 0 && h1 <= 20000 && h2 >= 0 && h2 <= 20000 && (wd === ht || (lib && W(o + 76) === 0 && (I(o + 72) === 1 || I(o + 72) === 0) && W(o + 86) <= 8 && (I(o+4) === 1 || I(o+4) === 3) && wd >= 100 && ht >= 100))) { recs.push({ o, k: 'P', A, B, rect: r, m, shape, drill: h1, h2, end: o + 86 }); last = o + 86; continue; }
      const p1 = [I(o + 76), I(o + 80)], p2 = [I(o + 84), I(o + 88)], w = I(o + 92), cx = (r[0] + r[2]) / 2, cy = (r[1] + r[3]) / 2;
      if (w >= 10 && w <= 30000) {
        const r1 = Math.hypot(p1[0] - cx, p1[1] - cy), r2 = Math.hypot(p2[0] - cx, p2[1] - cy);
        if (Math.abs(r1 - r2) < 4 && r1 > 50) { recs.push({ o, k: 'C', A, B, rect: r, p1, p2, w, cx, cy, rad: (r1 + r2) / 2 }); last = o + 96; }
      }
    }
    /* 2) textos (LOGFONT) */
    const texts = [];
    for (let o = 0; o < N - 150; o++) {
      const A = I(o), B = I(o + 4); if (A < 0 || A > 8 || B < 0 || B > 40) continue;
      const r = [I(o + 8), I(o + 12), I(o + 16), I(o + 20)]; if (!(r[2] > r[0] && r[3] > r[1] && r[2] - r[0] < 100000)) continue;
      const m = matOk(o + 24); if (!m) continue;
      for (const [off, nf] of [[104, 6], [100, 5]]) {
        const h = I(o + 72 + 4 * (nf === 6 ? 1 : 0)); if (h < 100 || h > 100000) continue;
        const face = printable(o + off, 32); if (!face || !/^[A-Za-z]/.test(face)) continue;
        const [s, end] = cstr(o + off + 32); texts.push({ o, A, B, rect: r, m, h, face, str: s, end }); o += 100; break;
      }
    }
    /* 2b) polígonos (cPoly): bbox exata dos pontos == retângulo; sem largura */
    const polys = []; { let lastp = -1; const taken = recs.map(r => [r.o, r.k === 'T' ? r.o + 32 + 8 * r.pts.length : r.o + 96]);
      for (let o = 0; o < N - 60; o++) {
        if (o < lastp) continue; const A = I(o), B = I(o + 4); if (A < 0 || A > 6 || B < 0 || B > 40) continue;
        const n = I(o + 24); if (n < 3 || n > 4000 || o + 36 + 8 * n > N) continue;
        const r = [I(o + 8), I(o + 12), I(o + 16), I(o + 20)]; if (!(r[2] > r[0] && r[3] > r[1])) continue;
        let x0 = 1e12, y0 = 1e12, x1 = -1e12, y1 = -1e12; const pts = [];
        for (let i = 0; i < n; i++) { const x = I(o + 28 + 8 * i), y = I(o + 32 + 8 * i); pts.push([x, y]); x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
        if (x0 !== r[0] || y0 !== r[1] || x1 !== r[2] || y1 !== r[3]) continue;
        if (I(o + 28 + 8 * n) !== 0) continue; if (taken.some(([a, b]) => o >= a && o < b)) continue;
        polys.push({ o, k: 'Y', A, B, rect: r, pts }); lastp = o + 32 + 8 * n;
      } }
    /* 3) footprints (instâncias) */
    const fps = [];
    for (let o = 2; o < N - 90; o++) {
      if (I(o) !== 0 || I(o + 4) !== 0) continue;
      const r = [I(o + 8), I(o + 12), I(o + 16), I(o + 20)]; if (!(r[2] > r[0] && r[3] > r[1] && r[2] - r[0] < 60000)) continue;
      const m = matOk(o + 24); if (!m || W(o + 72) !== 0) continue;
      
      let p = o + 74; const tt = W(p); p += 2; let text = null;
      if (tt === 0xFFFF) { p += 4 + W(p + 2); }
      if (tt === 0xFFFF || (tt & 0x8000)) {
        const t = texts.find(t => t.o === p); if (!t) continue; text = t; p = t.end + 4;
      } else if (tt !== 0) continue;
      if (lib && W(p) === 0) p += 2;
      let s1, s2, s3; [s1, p] = cstr(p); [s2, p] = cstr(p); [s3, p] = cstr(p);
      if (!/^[\x20-\x7e]*$/.test(s1 + s2 + s3)) continue;
      fps.push({ o, rect: r, m, text, s1, s2, s3, px: I(p), py: I(p + 4) });
    }
    /* 4) índice MFC de cada objeto (para resolver "pai" dos pads) */
    const ev = [];
    for (let o = 0; o < N - 8; o++) if (W(o) === 0xFFFF && W(o + 2) <= 4 && u8[o + 6] === 99 /* 'c' */) { const n = W(o + 4); if (n > 0 && n < 20 && /^c[A-Za-z]+$/.test(String.fromCharCode(...u8.subarray(o + 6, o + 6 + n)))) ev.push([o, 'class']); }
    for (const r of recs) ev.push([r.o, r]); for (const t of texts) ev.push([t.o, t]); for (const f of fps) ev.push([f.o, f]);
    ev.sort((a, b) => a[0] - b[0]); let idx = 0; for (const [, x] of ev) { idx++; if (x !== 'class') x.idx = idx; }
    return { recs, texts, fps, polys, I, W, D, cstr };
  }

  function segsOfRec(r) {
      if (r.k === 'T') return r.pts;
      const a1 = Math.atan2(r.p1[1] - r.cy, r.p1[0] - r.cx); let a2 = Math.atan2(r.p2[1] - r.cy, r.p2[0] - r.cx);
      let sw = a2 - a1; if (sw <= 1e-6) sw += 2 * Math.PI; const n = Math.max(8, Math.ceil(sw / (Math.PI / 12))), pts = [];
      for (let i = 0; i <= n; i++) { const a = a1 + sw * i / n; pts.push([r.cx + r.rad * Math.cos(a), r.cy + r.rad * Math.sin(a)]); }
      return pts;
  }
  function pointInRectLocal(f, bb, tol) { return bb[0] >= f.rect[0] - tol && bb[2] <= f.rect[2] + tol && bb[1] >= f.rect[1] - tol && bb[3] <= f.rect[3] + tol; }

  /* ---- converte para itens do UniPCB (mm, y para baixo) ---- */
  function toItems(P, opt) {
    opt = opt || {}; const cu = opt.copper || 'F.Cu', { recs, texts, fps, W, cstr } = P, mm = v => Math.round(v) / 1000, r4 = v => Math.round(v * 1e4) / 1e4;
    const T = (m, x, y) => [m[0] * x + m[1] * y + m[2], m[3] * x + m[4] * y + m[5]];
    const items = [], warn = [];
    const byIdx = new Map(fps.map(f => [f.idx, f]));
    for (const f of fps) { f.pads = []; f.lines = []; f.own = new Set(); }
    const nearestPrev = (o) => { let b = null; for (const f of fps) if (f.o <= o && (!b || f.o > b.o)) b = f; return b; };

    for (const r of padRecs) {

/* =====================  Exportação: Gerber / Excellon  ===================== */
class Gb {

  xy(p) { const [x, y] = this.T(p[0], p[1]); return `X${this.c(x)}Y${this.c(y)}`; }
  stroke(w, pts) { if (pts.length < 2) return; this.sel('C,' + w.toFixed(4)); this.body.push(this.xy(pts[0]) + 'D02*'); for (let i = 1; i < pts.length; i++) this.body.push(this.xy(pts[i]) + 'D01*'); }
  flash(def, x, y) { this.sel(def); this.body.push(this.xy([x, y]) + 'D03*'); }
  region(pts) { if (pts.length < 3) return; this.body.push('G36*', this.xy(pts[0]) + 'D02*'); for (let i = 1; i < pts.length; i++) this.body.push(this.xy(pts[i]) + 'D01*'); this.body.push(this.xy(pts[0]) + 'D01*', 'G37*'); }

    const h = ['G04 UniPCB*', '%FSLAX46Y46*%', '%MOMM*%', '%TF.GenerationSoftware,UniPCB,UniPCB,0.1*%', `%TF.FileFunction,${fn}*%`, '%TF.FilePolarity,Positive*%'];
    for (const [def, d] of this.ap) h.push(`%ADD${d}${def}*%`);
    return [...h, '%LPD*%', 'G01*', ...this.body, 'M02*'].join('\n') + '\n';

}
const f4 = v => (Math.round(v * 10000) / 10000).toFixed(4);
function padDef(s, grow) {
  const w = s.w + grow, h = s.h + grow;
  if (s.shape === 'round' || (s.shape === 'oval' && Math.abs(w - h) < 1e-6)) return 'C,' + f4(w);
  if (s.shape === 'oval') return `O,${f4(w)}X${f4(h)}`;
  return `R,${f4(w)}X${f4(h)}`;
}
function buildFab() {
  const B = edgeBBox(), T = (x, y) => [x - B.x0, B.y1 - y], sh = shapesAll(), name = doc.name || 'placa', files = {};
  const gerb = (L, fn, mask) => {
    const g = new Gb(T);
    for (const s of sh[L]) {
      if (mask) { if (s.k === 'pad') g.flash(padDef(s, 0.2), s.x, s.y); continue; }
      if (s.k === 'stroke') g.stroke(s.w, s.pts);
      else if (s.k === 'pad') g.flash(padDef(s, 0), s.x, s.y);
      else if (s.k === 'via') g.flash('C,' + f4(s.d), s.x, s.y);

  files[`${name}-B_Cu.gbl`] = gerb('B.Cu', 'Copper,L2,Bot');
  files[`${name}-F_Silkscreen.gto`] = gerb('F.Silk', 'Legend,Top');
  files[`${name}-B_Silkscreen.gbo`] = gerb('B.Silk', 'Legend,Bot');
  files[`${name}-F_Mask.gts`] = gerb('F.Cu', 'Soldermask,Top', true);
  files[`${name}-B_Mask.gbs`] = gerb('B.Cu', 'Soldermask,Bot', true);
  files[`${name}-Edge_Cuts.gm1`] = gerb('Edge', 'Profile,NP');

  const holes = new Map(); const add = (d, x, y) => { const k = f4(d); if (!holes.has(k)) holes.set(k, []); holes.get(k).push([x, y]); };
  const seen = new Set();
  for (const s of sh['F.Cu']) { if ((s.k === 'pad' && s.drill > 0) || (s.k === 'via')) { const key = s.x + ',' + s.y + ',' + s.drill; if (!seen.has(key)) { seen.add(key); add(s.drill, s.x, s.y); } } }

}
/* zip (sem compressão) */
const CRCT = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

    lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);

    ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);

$('#bFab').onclick = () => {

function printSVG(opt) {
  const B = docBBox() || { x0: 0, y0: 0, x1: 10, y1: 10 }, m = 2, x0 = B.x0 - m, y0 = B.y0 - m, W = B.x1 - B.x0 + 2 * m, H = B.y1 - B.y0 + 2 * m;
  const sh = shapesAll(), L = opt.layer, parts = [];
  const poly = pts => pts.map(p => p[0] + ',' + p[1]).join(' ');
  const padSvg = (s, fill) => {
    if (s.shape === 'round' || (s.shape === 'oval' && Math.abs(s.w - s.h) < 1e-6)) return `<circle cx="${s.x}" cy="${s.y}" r="${s.w / 2}" fill="${fill}"/>`;
    return `<rect x="${s.x - s.w / 2}" y="${s.y - s.h / 2}" width="${s.w}" height="${s.h}" rx="${s.shape === 'oval' ? Math.min(s.w, s.h) / 2 : 0}" fill="${fill}"/>`;
  };
  if (L === 'DRILL') {
    for (const s of [...sh['F.Cu'].filter(s => (s.k === 'pad' && s.drill > 0) || s.k === 'via'), ...sh.holes]) parts.push(`<circle cx="${s.x}" cy="${s.y}" r="${s.drill / 2}" fill="none" stroke="#000" stroke-width="0.1"/>`);
  } else {
    for (const s of sh[L]) {
      if (s.k === 'stroke') parts.push(`<polyline points="${poly(s.pts)}" fill="none" stroke="#000" stroke-width="${s.w}" stroke-linecap="round" stroke-linejoin="round"/>`);
      else if (s.k === 'zone') parts.push(`<polygon points="${poly(s.pts)}" fill="#000"/>`);
      else if (s.k === 'pad') parts.push(padSvg(s, '#000'));
      else if (s.k === 'via') parts.push(`<circle cx="${s.x}" cy="${s.y}" r="${s.d / 2}" fill="#000"/>`);
    }
    if (opt.holes) for (const s of [...sh[L].filter(s => (s.k === 'pad' && s.drill > 0) || s.k === 'via'), ...sh.holes]) parts.push(`<circle cx="${s.x}" cy="${s.y}" r="${Math.min(0.2, s.drill / 2 * 0.5)}" fill="#fff"/>`);
  }
  if (opt.edge && L !== 'Edge') for (const s of sh['Edge']) if (s.k === 'stroke') parts.push(`<polyline points="${poly(s.pts)}" fill="none" stroke="#000" stroke-width="0.1" stroke-dasharray="1 0.6"/>`);
  const g = opt.mirror ? `<g transform="translate(${2 * x0 + W},0) scale(-1,1)">${parts.join('')}</g>` : parts.join('');
  return { svg: `<svg xmlns="http://www.w3.org/2000/svg" width="${f4(W)}mm" height="${f4(H)}mm" viewBox="${x0} ${y0} ${W} ${H}">${g}</svg>`, W, H };
}

  const cm = el('input', { type: 'checkbox', checked: true }), ch = el('input', { type: 'checkbox', checked: true }), ce = el('input', { type: 'checkbox', checked: true }), prev = el('div', { id: 'prevbox' }), info = el('div', { style: 'color:var(--dim);margin-top:6px' });

  const upd = () => { if (sel.value === 'B.Cu' || sel.value === 'B.Silk') { if (!sel.dataset.touched) cm.checked = true; } const o = opt(), r = printSVG(o); prev.innerHTML = r.svg; info.textContent = `Tamanho real: ${r.W.toFixed(1)} × ${r.H.toFixed(1)} mm — imprima com escala 100% (sem ajustar à página).`; };

  const row = (l, i) => el('div', { className: 'row' }, el('label', { textContent: l }), i);
  const body = el('div', { style: 'width:min(560px,86vw)' }, sel, row('Espelhar', cm), row('Marcar centro dos furos', ch), row('Mostrar contorno (tracejado)', ce), prev, info);
  upd();
  modal('Imprimir em escala 1:1', body, [{ label: 'Fechar' }, { label: 'Imprimir', pri: true, fn: () => { const r = printSVG(opt()); $('#printSheet').innerHTML = r.svg; document.body.classList.add('printing'); setTimeout(() => { window.print(); }, 50); return true; } }]);
