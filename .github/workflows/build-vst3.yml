name: Build VST3 (Windows)

# Compila o plugin num runner Windows de verdade (com MSVC), na nuvem do
# GitHub. Nao precisa ter Visual Studio instalado na sua maquina.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar (CMake baixa o JUCE automaticamente)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar (Release)
        run: cmake --build build --config Release --parallel

      - name: Empacotar o .vst3 resultante
        shell: bash
        run: |
          mkdir -p artifact
          cp -r "build/SidechainCompressor_artefacts/Release/VST3/"* artifact/
          cd artifact
          zip -r ../SidechainCompressor-VST3.zip .
          cd ..

      - name: Publicar artifact para download
        uses: actions/upload-artifact@v4
        with:
          name: SidechainCompressor-VST3
          path: artifact/

      - name: Publicar release com o vst3 pronto
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Ultimo build
          files: SidechainCompressor-VST3.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
